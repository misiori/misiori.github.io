<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DAF</title>
    <meta name="description" content="rhythm-based game by misiori" />
    <meta property="og:title" content="DAF" />
    <meta property="og:description" content="rhythm-based game by misiori" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DAF" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game-frame {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh; /* корректная высота на мобильных с динамическим тулбаром */
        border: 0;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <iframe
      id="game-frame"
      src="https://dangerousantfarm.vercel.app"
      title="Dangerous Ant Farm"
      allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope; clipboard-write; cross-origin-isolated"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"
      loading="eager"
    ></iframe>
  </body>
</html>
