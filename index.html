<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>misiori.dev · indie dev</title>
    <!-- handwritten Google Fonts: Caveat + Patrick Hand for fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        /* minimal reset, black bg + white theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            /* handwritten font family – Caveat is primary, Patrick Hand fallback */
            font-family: 'Caveat', 'Patrick Hand', cursive;
            color: #ffffff;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            /* larger base size for handwritten readability */
            font-size: 1.4rem;
        }

        /* main container – keeps content tight and readable */
        .container {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2.2rem;
        }

        /* header — small, handwritten */
        .header {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
            padding-bottom: 0.5rem;
            font-family: 'Caveat', 'Patrick Hand', cursive;
        }

        .header .star {
            font-size: 2.6rem;
            line-height: 1;
            font-weight: 400;
            margin: 0 0.15rem;
            opacity: 0.9;
        }

        /* description — handwritten, friendly */
        .description {
            font-size: 1.5rem;
            font-weight: 400;
            color: #eaeaea;
            margin-top: -0.2rem;
            border-left: 4px solid #ffffff;
            padding-left: 1.4rem;
            line-height: 1.4;
        }

        .description p {
            margin-bottom: 0.8rem;
        }

        .description p:last-child {
            margin-bottom: 0;
        }

        /* projects section */
        .projects {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            margin-top: 0.3rem;
        }

        .projects h2 {
            font-family: 'Caveat', 'Patrick Hand', cursive;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #b0b0b0;
            margin-bottom: 0.2rem;
            text-transform: lowercase;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.3);
            padding-bottom: 0.3rem;
            display: inline-block;
            width: fit-content;
        }

        /* project cards — subtle border, hover accent */
        .project-card {
            display: block;
            background-color: #0b0b0b;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            padding: 1.6rem 1.9rem;
            text-decoration: none;
            color: #ffffff;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.1s ease;
            font-family: 'Caveat', 'Patrick Hand', cursive;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        .project-card:hover {
            border-color: #ffffff;
            background-color: #121212;
            transform: scale(1.01);
        }

        /* main project style – dangerous ant farm */
        .project-card.main-project {
            border: 3px solid #ffffff;
            background-color: #0f0f0f;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .project-card.main-project::after {
            content: "★ main";
            font-family: 'Caveat', 'Patrick Hand', cursive;
            position: absolute;
            top: -0.9rem;
            right: 1.8rem;
            background: #000000;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 500;
            padding: 0.2rem 1rem;
            border-radius: 100px;
            border: 1px solid #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        .project-title {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
            font-family: 'Caveat', 'Patrick Hand', cursive;
        }

        .project-desc {
            font-size: 1.3rem;
            color: #c0c0c0;
            margin-bottom: 0.3rem;
            font-weight: 400;
            line-height: 1.4;
            font-family: 'Caveat', 'Patrick Hand', cursive;
        }

        /* no tags, no url in the interface — removed from visible UI */

        /* footer */
        .footer {
            margin-top: 1.8rem;
            border-top: 2px dashed rgba(255, 255, 255, 0.2);
            padding-top: 2rem;
            text-align: center;
            color: #a0a0a0;
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            font-family: 'Caveat', 'Patrick Hand', cursive;
        }

        .footer span {
            color: #ffffff;
            font-weight: 600;
            opacity: 0.95;
        }

        /* responsive */
        @media (max-width: 480px) {
            body {
                padding: 1.5rem 1rem;
                font-size: 1.2rem;
            }

            .header {
                font-size: 2rem;
            }

            .header .star {
                font-size: 2.2rem;
            }

            .description {
                font-size: 1.3rem;
                padding-left: 1rem;
            }

            .project-card {
                padding: 1.3rem 1.4rem;
            }

            .project-title {
                font-size: 1.7rem;
            }

            .project-desc {
                font-size: 1.15rem;
            }

            .project-card.main-project::after {
                font-size: 1rem;
                top: -0.8rem;
                right: 1rem;
                padding: 0.15rem 0.8rem;
            }

            .footer {
                font-size: 1.2rem;
            }
        }

        /* selection style */
        ::selection {
            background: #ffffff;
            color: #000000;
        }

        /* smooth link focus */
        a:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- small header: misiori ☆ dev -->
        <header class="header">
            misiori <span class="star">☆</span> dev
        </header>

        <!-- description -->
        <div class="description">
            <p>hey! im an indie dev. i develop some games, sometimes ai and even more rarely — gd lvls. check out my projects!</p>
        </div>

        <!-- projects -->
        <div class="projects">
            <h2>projects</h2>

            <!-- dangerous ant farm – main project, first -->
            <a href="https://dangerousantfarm.vercel.app" target="_blank" rel="noopener noreferrer" class="project-card main-project">
                <div class="project-title">
                    dangerous ant farm
                </div>
                <div class="project-desc">
                    a rhythm based game by me!
                </div>
            </a>

            <!-- naisuru – secondary -->
            <a href="https://startorigin.me" target="_blank" rel="noopener noreferrer" class="project-card">
                <div class="project-title">
                    naisuru
                </div>
                <div class="project-desc">
                    an ai service where you can create whoever u want with a prompt.
                </div>
            </a>
        </div>

        <!-- footer -->
        <footer class="footer">
            <span>ty all!!</span> ✦
        </footer>
    </div>
</body>
</html>
